<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title> - Pediatric Quiz Bank</title>
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --primary: #0f766e;
    --primary-dark: #115e59;
    --primary-light: #ccfbf1;
    --accent: #2563eb;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --success-bg: #dcfce7;
    --success-border: #16a34a;
    --success-text: #14532d;
    --error-bg: #fee2e2;
    --error-border: #dc2626;
    --error-text: #7f1d1d;
    --warn-bg: #fef3c7;
    --warn-border: #d97706;
    --warn-text: #78350f;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.65;
    padding-bottom: 60px;
  }

  header {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary), #0284c7);
    color: #fff;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.12);
  }

  header h1 {
    font-size: 1.8rem;
    margin-bottom: 8px;
  }

  header p {
    font-size: 0.98rem;
    opacity: 0.92;
  }

  .container {
    max-width: 980px;
    margin: 24px auto 0;
    padding: 0 16px;
  }

  .controls-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    margin-bottom: 20px;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    flex: 1;
  }

  select, input[type="text"], button {
    font-family: inherit;
    font-size: 0.95rem;
    border-radius: 9px;
    border: 1px solid var(--border);
    padding: 9px 13px;
    outline: none;
    transition: all 0.2s ease;
  }

  select, input[type="text"] {
    background: #f8fafc;
    color: var(--text);
  }

  input[type="text"] {
    min-width: 210px;
    flex: 1;
    max-width: 320px;
  }

  select:focus, input[type="text"]:focus {
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
  }

  .btn {
    cursor: pointer;
    font-weight: 600;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn-secondary {
    background: #e2e8f0;
    color: var(--text);
  }

  .btn-secondary:hover {
    background: #cbd5e1;
  }

  .stats-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 20px;
    margin-bottom: 22px;
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 0.95rem;
  }

  .badge {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
  }

  .badge-total { background: #e0f2fe; color: #0369a1; }
  .badge-correct { background: var(--success-bg); color: var(--success-text); }
  .badge-wrong { background: var(--error-bg); color: var(--error-text); }
  .badge-answered { background: var(--primary-light); color: var(--primary-dark); }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    transition: border-color 0.2s ease;
  }

  .question-card.is-correct {
    border-color: var(--success-border);
  }

  .question-card.is-wrong {
    border-color: var(--error-border);
  }

  .q-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
    font-size: 0.82rem;
  }

  .q-num {
    background: var(--primary);
    color: #fff;
    padding: 3px 10px;
    border-radius: 7px;
    font-weight: 700;
  }

  .q-source {
    background: #f1f5f9;
    color: var(--muted);
    padding: 3px 10px;
    border-radius: 7px;
    font-weight: 600;
  }

  .q-text {
    font-size: 1.06rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 14px;
    direction: ltr;
    text-align: left;
    unicode-bidi: plaintext;
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .option-btn {
    width: 100%;
    text-align: left;
    direction: ltr;
    unicode-bidi: plaintext;
    background: #f8fafc;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 11px 15px;
    font-size: 0.96rem;
    color: var(--text);
    cursor: pointer;
    transition: all 0.16s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background: #f0fdfa;
  }

  .option-btn:disabled {
    cursor: default;
  }

  .option-btn.correct {
    background: var(--success-bg);
    border-color: var(--success-border);
    color: var(--success-text);
    font-weight: 600;
  }

  .option-btn.wrong {
    background: var(--error-bg);
    border-color: var(--error-border);
    color: var(--error-text);
    font-weight: 600;
  }

  .feedback-box {
    margin-top: 13px;
    padding: 12px 15px;
    border-radius: 10px;
    font-size: 0.93rem;
    display: none;
  }

  .feedback-box.show {
    display: block;
  }

  .feedback-box.correct-fb {
    background: var(--success-bg);
    border-right: 4px solid var(--success-border);
    color: var(--success-text);
  }

  .feedback-box.wrong-fb {
    background: var(--error-bg);
    border-right: 4px solid var(--error-border);
    color: var(--error-text);
  }

  .feedback-box.no-key-fb {
    background: var(--warn-bg);
    border-right: 4px solid var(--warn-border);
    color: var(--warn-text);
  }

  .note-text {
    margin-top: 7px;
    padding-top: 7px;
    border-top: 1px dashed rgba(0, 0, 0, 0.12);
    font-size: 0.9rem;
    direction: rtl;
    text-align: right;
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--border);
    color: var(--muted);
    display: none;
  }

  @media (max-width: 640px) {
    header h1 { font-size: 1.4rem; }
    .question-card { padding: 16px; }
  }
</style>

const userAnswers = {};
const questionsContainer = document.getElementById("questionsContainer");
const sectionFilter = document.getElementById("sectionFilter");
const searchInput = document.getElementById("searchInput");
const resetBtn = document.getElementById("resetBtn");
const emptyState = document.getElementById("emptyState");

function populateSections() {
  const sections = [...new Set(QUESTIONS.map(q => q.section))];
  sections.forEach(sec => {
    const opt = document.createElement("option");
    opt.value = sec;
    opt.textContent = sec;
    sectionFilter.appendChild(opt);
  });
}

function getFilteredQuestions() {
  const sec = sectionFilter.value;
  const term = searchInput.value.trim().toLowerCase();
  return QUESTIONS.filter(q => {
    const matchSec = sec === "ALL" || q.section === sec;
    const matchTerm =
      !term ||
      q.q.toLowerCase().includes(term) ||
      q.options.some(o => o.toLowerCase().includes(term)) ||
      (q.note && q.note.toLowerCase().includes(term));
    return matchSec && matchTerm;
  });
}

function updateStats(visibleQuestions) {
  let answered = 0;
  let correct = 0;
  let wrong = 0;

  visibleQuestions.forEach(q => {
    const chosen = userAnswers[q.id];
    if (chosen !== undefined) {
      answered++;
      if (q.answer !== null && q.answer !== undefined) {
        if (chosen === q.answer) correct++;
        else wrong++;
      }
    }
  });

  document.getElementById("statTotal").textContent = visibleQuestions.length;
  document.getElementById("statAnswered").textContent = answered;
  document.getElementById("statCorrect").textContent = correct;
  document.getElementById("statWrong").textContent = wrong;
}

function renderQuestions() {
  const visible = getFilteredQuestions();
  questionsContainer.innerHTML = "";
  updateStats(visible);

  if (visible.length === 0) {
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";

  visible.forEach(q => {
    const chosen = userAnswers[q.id];
    const hasAnswered = chosen !== undefined;
    const hasKey = q.answer !== null && q.answer !== undefined;

    const card = document.createElement("div");
    card.className = "question-card";
    if (hasAnswered && hasKey) {
      card.classList.add(chosen === q.answer ? "is-correct" : "is-wrong");
    }

    const meta = document.createElement("div");
    meta.className = "q-meta";
    meta.innerHTML = `<span class="q-num">سؤال #${q.id}</span><span class="q-source">${q.section}</span>`;

    const qText = document.createElement("div");
    qText.className = "q-text";
    qText.textContent = q.q;

    const optionsList = document.createElement("div");
    optionsList.className = "options-list";

    q.options.forEach((optText, idx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option-btn";
      btn.textContent = optText;

      if (hasAnswered) {
        btn.disabled = true;
        if (hasKey) {
          if (idx === q.answer) {
            btn.classList.add("correct");
          } else if (idx === chosen && chosen !== q.answer) {
            btn.classList.add("wrong");
          }
        } else if (idx === chosen) {
          btn.style.borderColor = "#d97706";
          btn.style.background = "#fef3c7";
        }
      }

      btn.addEventListener("click", () => {
        userAnswers[q.id] = idx;
        renderQuestions();
      });

      optionsList.appendChild(btn);
    });

    const feedback = document.createElement("div");
    feedback.className = "feedback-box";
    if (hasAnswered) {
      feedback.classList.add("show");
      if (!hasKey) {
        feedback.classList.add("no-key-fb");
        feedback.innerHTML = `تم تسجيل اختيارك: <strong>${q.options[chosen]}
      } else if (chosen === q.answer) {
        feedback.classList.add("correct-fb");
        feedback.innerHTML = إجابة صحيحة: <strong>${q.options[q.answer]}</strong>`;
      } else {
        feedback.classList.add("wrong-fb");
        feedback.innerHTML = `إجابتك: <strong>${q.options[chosen]}</strong> — الإجابة هي: <strong>${q.options[q.answer]}</strong>`;
      }
      if (q.note) {
        feedback.innerHTML += `<div class="note-text">${q.note}</div>`;
      }
    }

    card.appendChild(meta);
    card.appendChild(qText);
    card.appendChild(optionsList);
    card.appendChild(feedback);
    questionsContainer.appendChild(card);
  });
}

sectionFilter.addEventListener("change", renderQuestions);
searchInput.addEventListener("input", renderQuestions);
resetBtn.addEventListener("click", () => {
  Object.keys(userAnswers).forEach(k => delete userAnswers[k]);
  renderQuestions();
});

populateSections();
renderQuestions();
</script>
